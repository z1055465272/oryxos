<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect width="1040" height="660" fill="#ffffff"/>

  <!-- Title -->
  <text x="520" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">OryxOS 架构</text>
  <text x="520" y="58" text-anchor="middle" font-size="13" fill="#6b7280">五大核心能力 · 9 个 Maven 模块 · 单二进制部署</text>

  <!-- Layer labels -->
  <text x="48" y="129" font-size="13" font-weight="700" fill="#3b82f6">接入层</text>
  <text x="48" y="254" font-size="13" font-weight="700" fill="#7c3aed">引擎层</text>
  <text x="48" y="399" font-size="13" font-weight="700" fill="#0d9488">能力层</text>
  <text x="48" y="529" font-size="13" font-weight="700" fill="#6b7280">基础层</text>

  <!-- L1: 接入层 -->
  <rect x="230" y="95" width="230" height="60" rx="10" fill="#ebf4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="345" y="121" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">CLI Channel</text>
  <text x="345" y="140" text-anchor="middle" font-size="10" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">oryxos-channel-cli</text>

  <rect x="560" y="95" width="230" height="60" rx="10" fill="#ebf4ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="675" y="121" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Web Service (REST API)</text>
  <text x="675" y="140" text-anchor="middle" font-size="10" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">oryxos-web</text>

  <!-- arrows L1 -> L2 -->
  <line x1="345" y1="156" x2="345" y2="197" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="675" y1="156" x2="675" y2="197" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- L2: 引擎层 container -->
  <rect x="180" y="200" width="680" height="100" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- PromptBuilder -->
  <rect x="210" y="228" width="170" height="44" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="295" y="249" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">PromptBuilder</text>
  <text x="295" y="264" text-anchor="middle" font-size="10" fill="#6b7280">组装提示词</text>
  <!-- ReActLoop (prominent) -->
  <rect x="410" y="216" width="220" height="68" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="520" y="244" text-anchor="middle" font-size="16" font-weight="700" fill="#4c1d95">ReActLoop</text>
  <text x="520" y="263" text-anchor="middle" font-size="10" fill="#6b7280">Agent 大脑 · 核心循环</text>
  <!-- ToolExecutor -->
  <rect x="660" y="228" width="170" height="44" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="745" y="249" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">ToolExecutor</text>
  <text x="745" y="264" text-anchor="middle" font-size="10" fill="#6b7280">执行工具</text>
  <!-- flow arrows -->
  <line x1="380" y1="250" x2="407" y2="250" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-flow)"/>
  <line x1="630" y1="250" x2="657" y2="250" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-flow)"/>
  <text x="520" y="294" text-anchor="middle" font-size="10" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-style="italic">oryxos-core</text>

  <!-- arrows L2 -> L3 (labeled) -->
  <line x1="270" y1="301" x2="270" y2="338" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="278" y="324" font-size="10" fill="#6b7280">调 LLM</text>
  <line x1="520" y1="301" x2="520" y2="338" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="528" y="324" font-size="10" fill="#6b7280">取上下文</text>
  <line x1="770" y1="301" x2="770" y2="338" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="778" y="324" font-size="10" fill="#6b7280">执行</text>

  <!-- L3: 能力层 -->
  <rect x="170" y="340" width="200" height="110" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="270" y="370" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">Provider</text>
  <text x="270" y="390" text-anchor="middle" font-size="11" fill="#6b7280">LLM 调用抽象</text>
  <text x="270" y="408" text-anchor="middle" font-size="10" fill="#9ca3af">DeepSeek · 通义 · Kimi · …</text>
  <text x="270" y="432" text-anchor="middle" font-size="10" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-style="italic">oryxos-provider</text>

  <rect x="420" y="340" width="200" height="110" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="520" y="370" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">Memory</text>
  <text x="520" y="390" text-anchor="middle" font-size="11" fill="#6b7280">三层记忆门面</text>
  <text x="520" y="408" text-anchor="middle" font-size="10" fill="#9ca3af">会话 · 长期(MEMORY.md)</text>
  <text x="520" y="432" text-anchor="middle" font-size="10" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-style="italic">oryxos-memory</text>

  <rect x="670" y="340" width="200" height="110" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="770" y="370" text-anchor="middle" font-size="16" font-weight="700" fill="#115e59">Tool</text>
  <text x="770" y="390" text-anchor="middle" font-size="11" fill="#6b7280">内置 + Plugin</text>
  <text x="770" y="408" text-anchor="middle" font-size="10" fill="#9ca3af">文件·Shell·HTTP·MCP</text>
  <text x="770" y="432" text-anchor="middle" font-size="10" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-style="italic">oryxos-tool</text>

  <!-- external MCP server -->
  <line x1="870" y1="395" x2="907" y2="395" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-dash)"/>
  <text x="888" y="388" text-anchor="middle" font-size="9" fill="#6b7280">MCP</text>
  <rect x="910" y="365" width="115" height="62" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="967" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#4b5563">外部 MCP</text>
  <text x="967" y="410" text-anchor="middle" font-size="11" fill="#6b7280">server</text>

  <!-- L4: 基础层 -->
  <rect x="170" y="480" width="700" height="90" rx="12" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="520" y="508" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">基础层（工程地基）</text>
  <text x="520" y="538" text-anchor="middle" font-size="12" fill="#4b5563">Profile / Bootstrap / Skill 加载  ·  Session 存储  ·  SQLite  ·  配置与密钥加载</text>
  <text x="520" y="558" text-anchor="middle" font-size="10" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-style="italic">oryxos-storage · oryxos-boot · oryxos-cli</text>

  <!-- footer -->
  <text x="520" y="608" text-anchor="middle" font-size="11" fill="#9ca3af" font-style="italic">外部依赖（LLM 厂商 API、外部 MCP server）在应用边界之外，OryxOS 自身不绑定任何一家</text>
  <text x="520" y="628" text-anchor="middle" font-size="11" fill="#9ca3af" font-style="italic">同步阻塞 + Java 21 virtual thread 撑并发 · 单二进制装好就跑</text>
</svg>
