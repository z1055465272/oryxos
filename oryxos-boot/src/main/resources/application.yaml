# OryxOS 默认配置（核心阶段骨架）
# 完整配置（Provider/Profile/Skill/MCP 等）在 US-1 对接 LLM、US-5 持久化时补充
spring:
  application:
    name: oryxos
  datasource:
    url: jdbc:sqlite:.oryxos/oryxos.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # 骨架阶段无 @Entity，先 none；US-5 建 sessions/tool_invocations/llm_calls 时按需 update
      ddl-auto: none
  threads:
    # Java 21 虚拟线程：单机扛高并发，ReAct Loop 全程同步阻塞也够
    virtual:
      enabled: true

server:
  port: 8080

# 工程地基：Actuator + Micrometer + Prometheus 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: oryxos

# 工程地基：OpenAPI 文档
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
