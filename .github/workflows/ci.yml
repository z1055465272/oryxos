name: CI

# 工程地基门禁：任何 Java 代码变更都必须过格式 / 规约 / 安全检查，任一失败禁止合并。
# 触发：main 分支的 Java 代码 / pom / CI 配置变更，或手动触发。
on:
  push:
    branches: [main]
    paths:
      - '**/*.java'
      - '**/pom.xml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**/*.java'
      - '**/pom.xml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  verify:
    name: mvn verify (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify build (compile + test + repackage)
        run: mvn -B -ntp verify

      # 规范门禁：格式（Spotless）+ 兜底（Checkstyle）
      - name: Formatting (Spotless + google-java-format)
        run: mvn -B -ntp spotless:check

      - name: Checkstyle (google_checks)
        run: mvn -B -ntp checkstyle:check

      # 编码规约门禁：阿里 P3C（PMD 6）
      - name: Alibaba P3C (PMD)
        run: mvn -B -ntp pmd:check

      # 安全门禁：SpotBugs + Find Security Bugs
      - name: SpotBugs (Find Security Bugs)
        run: mvn -B -ntp -DskipTests spotbugs:check

      # 第三方依赖 CVE：OWASP Dependency-Check（failBuildOnCVSS=7，见父 pom）
      - name: OWASP Dependency-Check
        run: mvn -B -ntp -DskipTests dependency-check:check

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 7
